# Experiment 7 — Per-label threshold optimization.
# Motivation: All prior experiments use a global 0.5 cutoff. Because
# label base rates differ by an order of magnitude, the
# probability-to-decision boundary that minimizes Hamming Loss is NOT
# 0.5 for most labels. We tune one threshold per label on the
# validation fold by grid-searching F1 (a smoother proxy than
# per-label Hamming, which is degenerate when a label is rare).
# Hypothesis: per-label threshold tuning improves Hamming Loss by
# 10-25% relative without retraining the model.
name: "exp07_threshold_tuning"
inherits: "default.yaml"
notes: |
  Same model/features as the winning configuration from Exp 6. Adds
  per-label threshold search on the validation set; thresholds frozen
  and applied at test time.
features:
  use: ["tfidf_word", "tfidf_char", "sbert"]
  sbert_combine: "concat"
model:
  type: "logreg_ovr"
evaluation:
  per_label_threshold: true
  threshold_search_grid: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65]
  threshold_objective: "f1"
inference:
  min_labels_per_doc: 1        # force at least one indicator — every Devex doc is SDG-3 relevant
